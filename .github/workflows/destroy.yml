name: Destroy (dev)

# Tears the whole dev stack down. Manual, and waits for approval in the "dev"
# environment. Run it as soon as you're done testing: the stack costs about
# $2/day while it's up and $0 after this (the state bucket costs cents/month).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  TF_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "true"
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}
  # Repository variables, passed through env rather than pasted into scripts.
  STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
  ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}

jobs:
  destroy:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: infra/envs/dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Destroy
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=$AWS_REGION"
          terraform destroy -input=false -auto-approve -var "image_tag=destroy"
          echo "Stack destroyed. Remaining cost: state bucket (cents/month)." >> "$GITHUB_STEP_SUMMARY"
