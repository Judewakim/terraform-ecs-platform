name: CI

# Free to run: every job here except "plan" works with no AWS account at all.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_VERSION: "1.17.1"
  TF_IN_AUTOMATION: "true"

jobs:
  app:
    name: App tests (incl. real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PG_ADMIN_DSN: host=localhost port=5432 user=postgres password=ci-only-password dbname=postgres sslmode=disable
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    name: Container build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: app
          push: false
          load: true
          tags: shortlink:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the image
        run: |
          docker run -d --name app -e STORE=memory -p 8080:8080 --read-only --user 10001 shortlink:ci
          for i in $(seq 1 20); do curl -fsS localhost:8080/ready && break; sleep 1; done
          code=$(curl -fsS -X POST localhost:8080/links -H 'content-type: application/json' -d '{"url":"https://example.com"}' | jq -r .code)
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8080/$code)" = "302"
          docker rm -f app

  terraform:
    name: Terraform fmt, validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: Format
        run: terraform fmt -check -recursive infra
      - name: Validate
        run: |
          for dir in infra/bootstrap infra/envs/dev; do
            echo "::group::$dir"
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
            echo "::endgroup::"
          done
      - name: Module tests (mocked AWS, no credentials)
        run: |
          for dir in infra/modules/*/; do
            if [ -d "$dir/tests" ]; then
              echo "::group::$dir"
              terraform -chdir=$dir init -input=false
              terraform -chdir=$dir test
              echo "::endgroup::"
            fi
          done

  security:
    name: Checkov security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install checkov==3.4.0
      # Every skipped check is skipped inline, next to the resource, with a reason.
      - run: checkov -d infra --framework terraform --compact --quiet
      - run: checkov -d . --framework github_actions,dockerfile --compact --quiet

  plan:
    name: Terraform plan (dev)
    # Needs the AWS role from infra/bootstrap. Skips cleanly until it exists.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: [terraform, security]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      PLAN_ROLE: ${{ secrets.AWS_PLAN_ROLE_ARN }}
      STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - name: Check setup
        id: setup
        run: |
          if [ -n "$PLAN_ROLE" ] && [ -n "$STATE_BUCKET" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"
          else echo "AWS_PLAN_ROLE_ARN secret or TF_STATE_BUCKET variable not set; skipping plan." >> "$GITHUB_STEP_SUMMARY"; fi
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.setup.outputs.ready == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.PLAN_ROLE }}
          aws-region: us-east-1
      - if: steps.setup.outputs.ready == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - if: steps.setup.outputs.ready == 'true'
        name: Plan
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=$STATE_BUCKET" -backend-config="region=us-east-1"
          terraform plan -input=false -lock-timeout=5m -no-color -var "image_tag=${{ github.sha }}" -var "alert_email=$ALERT_EMAIL" -out=tfplan | tee plan.txt
          {
            echo '### Terraform plan (dev)'
            echo '```'
            grep -E '^(Plan:|No changes)' plan.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
